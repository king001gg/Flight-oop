server.port=8080
spring.application.name=flight-booking-web

# 运行时数据目录（flights.dat / orders.dat / customers.dat / users.dat）
app.data-dir=./data

# 统一 UTF-8，避免 Windows 中文乱码
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# 日期按 ISO 字符串输出而不是时间戳数组
spring.jackson.serialization.write-dates-as-timestamps=false

logging.level.oop=INFO
