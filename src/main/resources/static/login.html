<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>登录 · 航空公司订票管理系统</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
<main class="auth-page">
    <section class="auth-hero">
        <div class="auth-brand">
            <div class="brand-mark">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
                </svg>
            </div>
            <div>
                <div class="auth-brand-name">航空订票</div>
                <div class="auth-brand-sub">FLIGHT BOOKING SYSTEM</div>
            </div>
        </div>

        <div class="auth-copy">
            <h1>让每一次飞行<br>都从从容容开始</h1>
            <p>航班查询、在线订票、订单退票、航线统计与报表打印，一个系统完成。
               管理员与客户使用同一套真实数据，操作记录实时保存。</p>
            <div class="auth-features">
                <div class="auth-feature">
                    <strong>实时航班</strong>
                    <span>余票、票价与满仓状态实时更新</span>
                </div>
                <div class="auth-feature">
                    <strong>角色权限</strong>
                    <span>管理员管数据，客户只管自己的订单</span>
                </div>
                <div class="auth-feature">
                    <strong>统计报表</strong>
                    <span>航线载客与月度销售一键汇总</span>
                </div>
            </div>
        </div>

        <div class="auth-footnote">© 2026 Flight Booking System · Web 全栈课程设计</div>
    </section>

    <section class="auth-panel">
        <div class="auth-card">
            <h2 class="auth-title">欢迎回来</h2>
            <p class="auth-sub">登录后可查询航班、订票或进入管理后台</p>

            <div class="auth-alert" id="authAlert" role="alert"></div>

            <form class="auth-form" id="loginForm" novalidate>
                <div class="field">
                    <label for="username">用户名</label>
                    <input class="input" id="username" name="username" type="text"
                           placeholder="请输入用户名" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="password">密码</label>
                    <input class="input" id="password" name="password" type="password"
                           placeholder="请输入密码" autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary btn-block" type="submit" id="loginBtn">登 录</button>
            </form>

            <div class="auth-demo">
                <strong>演示账号</strong>
                <div class="demo-accounts">
                    <button class="demo-account" type="button" data-user="admin" data-pass="admin123">
                        <b>管理员</b><span>admin / admin123</span>
                    </button>
                    <button class="demo-account" type="button" data-user="zhangwei" data-pass="123456">
                        <b>客户</b><span>zhangwei / 123456</span>
                    </button>
                </div>
            </div>

            <div class="auth-switch">还没有账号？<a href="register.html">立即注册</a></div>
        </div>
    </section>
</main>
<script type="module" src="js/pages/login.js"></script>
</body>
</html>
