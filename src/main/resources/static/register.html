<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>注册 · 航空公司订票管理系统</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
<main class="auth-page">
    <section class="auth-hero">
        <div class="auth-brand">
            <div class="brand-mark">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
                </svg>
            </div>
            <div>
                <div class="auth-brand-name">航空订票</div>
                <div class="auth-brand-sub">FLIGHT BOOKING SYSTEM</div>
            </div>
        </div>

        <div class="auth-copy">
            <h1>创建客户账号<br>开启你的旅程</h1>
            <p>注册后会自动创建客户资料，你可以查询航班、在线订票、查看订单和申请退票。
               管理员账号由后台统一管理，不开放注册。</p>
            <div class="auth-features">
                <div class="auth-feature">
                    <strong>在线订票</strong>
                    <span>选择航班、填写数量，立即生成订单</span>
                </div>
                <div class="auth-feature">
                    <strong>订单可退</strong>
                    <span>未出行订单支持整单退票，座位自动回补</span>
                </div>
                <div class="auth-feature">
                    <strong>资料安全</strong>
                    <span>密码使用 BCrypt 哈希存储</span>
                </div>
            </div>
        </div>

        <div class="auth-footnote">© 2026 Flight Booking System · Web 全栈课程设计</div>
    </section>

    <section class="auth-panel">
        <div class="auth-card">
            <h2 class="auth-title">注册客户账号</h2>
            <p class="auth-sub">带 * 的信息为必填项</p>

            <div class="auth-alert" id="authAlert" role="alert"></div>

            <form class="auth-form" id="registerForm" novalidate>
                <div class="field">
                    <label for="username">用户名 *</label>
                    <input class="input" id="username" name="username" type="text"
                           placeholder="3~30 位，用于登录" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="password">密码 *</label>
                    <input class="input" id="password" name="password" type="password"
                           placeholder="至少 6 位" autocomplete="new-password" required>
                </div>
                <div class="field">
                    <label for="confirmPassword">确认密码 *</label>
                    <input class="input" id="confirmPassword" name="confirmPassword" type="password"
                           placeholder="再次输入密码" autocomplete="new-password" required>
                </div>
                <div class="field">
                    <label for="name">姓名 *</label>
                    <input class="input" id="name" name="name" type="text"
                           placeholder="请输入真实姓名" required>
                </div>
                <div class="field">
                    <label for="idNumber">证件号 *</label>
                    <input class="input" id="idNumber" name="idNumber" type="text"
                           placeholder="身份证 / 护照号" required>
                </div>
                <div class="field">
                    <label for="phone">手机号</label>
                    <input class="input" id="phone" name="phone" type="tel"
                           placeholder="选填" autocomplete="tel">
                </div>
                <div class="field">
                    <label for="email">邮箱</label>
                    <input class="input" id="email" name="email" type="email"
                           placeholder="选填" autocomplete="email">
                </div>
                <button class="btn btn-primary btn-block" type="submit" id="registerBtn">注 册</button>
            </form>

            <div class="auth-switch">已有账号？<a href="login.html">返回登录</a></div>
        </div>
    </section>
</main>
<script type="module" src="js/pages/register.js"></script>
</body>
</html>
